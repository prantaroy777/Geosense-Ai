[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "geosense-ai"
dynamic = ["version"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]
description = "Extensible satellite event screening and GIS mapping"
requires-python = ">=3.10"
dependencies = ["scipy>=1.10,<2", "numpy>=1.24,<3", "rasterio>=1.3,<2", "pyproj>=3.5,<4", "shapely>=2,<3", "matplotlib>=3.7,<4", "streamlit>=1.40,<2", "reportlab>=4,<6", "pypdf>=5,<7", "fiona>=1.10,<2", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
geosense = "geosense.cli:main"

[tool.setuptools.packages.find]
include = ["geosense*"]

[tool.setuptools.dynamic]
version = {attr = "geosense.__version__"}

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv*", "output", "outputs", "tmp", "dist", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
